name: Сборка

# Собирать Windows-версию можно только на Windows: flutter build windows
# требует MSVC. На машине разработчика (macOS) её не собрать, поэтому
# сборка и упаковка живут здесь.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

env:
  FLUTTER_VERSION: '3.44.6'
  # Сборка с libass: без неё фильтра subtitles не существует и вшивание
  # субтитров невозможно.
  # Статическая сборка: один самодостаточный ffmpeg.exe без DLL рядом.
  # ffprobe не везём — длительность приложение читает у самого ffmpeg,
  # а второй такой же статический бинарник стоил бы лишних 98 МБ.
  FFMPEG_URL: 'https://github.com/GyanD/codexffmpeg/releases/download/9.0.1/ffmpeg-9.0.1-essentials_build.zip'

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Зависимости
        run: flutter pub get

      # ffmpeg нужен ДО тестов: часть тестов реально запускает его, а на
      # раннерах GitHub его нет вообще. Заодно тесты вшивания субтитров
      # выполняются здесь по-настоящему — на macOS они пропускаются,
      # потому что там ffmpeg обычно без libass.
      - name: Скачать ffmpeg с libass
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:FFMPEG_URL -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_unpacked
          $bin = Get-ChildItem -Path ffmpeg_unpacked -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $bin) { throw "ffmpeg.exe не найден в архиве" }
          $filters = & $bin.FullName -hide_banner -filters
          if (-not ($filters -match '\bsubtitles\b')) {
            throw "В скачанной сборке ffmpeg нет фильтра subtitles (нет libass)"
          }
          New-Item -ItemType Directory -Force -Path dist/tools/ffmpeg | Out-Null
          Copy-Item $bin.FullName dist/tools/ffmpeg/
          $license = Get-ChildItem -Path ffmpeg_unpacked -Recurse -Filter LICENSE* | Select-Object -First 1
          if ($license) { Copy-Item $license.FullName dist/tools/ffmpeg/ }
          # Тесты и приложение читают эти переменные.
          "SUBTITLER_FFMPEG=$(Resolve-Path dist/tools/ffmpeg/ffmpeg.exe)" >> $env:GITHUB_ENV
          # ffprobe в сборку не кладём: приложение обходится без него.
          # Для тестов на этом раннере он тоже не нужен — длительность
          # читается из вывода ffmpeg.

      - name: Анализ и тесты
        run: |
          flutter analyze
          flutter test

      - name: Сборка
        run: flutter build windows --release

      - name: Собрать переносимую папку
        shell: pwsh
        run: |
          Copy-Item -Recurse build/windows/x64/runner/Release/* dist/
          Copy-Item -Recurse assets/fonts dist/fonts

          # ffmpeg_kit_flutter_new нужен только на Android. На Windows работа
          # идёт через видимый tools/ffmpeg/ffmpeg.exe, LibFfmpegRunner там не
          # создаётся вовсе — но плагин во время сборки СКАЧИВАЕТ собственный
          # полный ffmpeg и кладёт его рядом с exe. Это 117 МБ, которые никто
          # не открывает, и бинарь, который никто не проверял: ровно то, от
          # чего мы ушли, выбрав пиновую сборку gyan.dev.
          # Удаляем по источнику, а не по списку имён: список версия от версии
          # меняется, а папка плагина знает его точно. Саму заглушку
          # ffmpeg_kit_flutter_new_plugin.dll трогать нельзя — её импортирует
          # subtitler.exe, и без неё приложение не стартует вообще.
          $kitBin = 'build/windows/x64/plugins/ffmpeg_kit_flutter_new/ffmpeg-kit/bin'
          if (Test-Path $kitBin) {
            $freed = 0
            foreach ($dll in Get-ChildItem $kitBin -Filter *.dll) {
              $victim = Join-Path dist $dll.Name
              if (Test-Path $victim) {
                $freed += (Get-Item $victim).Length
                Remove-Item $victim -Force
              }
            }
            Write-Host ("Выброшена неиспользуемая сборка ffmpeg-kit: {0:N1} МБ" -f ($freed / 1MB))
          } else {
            Write-Host "Папка ffmpeg-kit не найдена — проверка размера ниже поймает, если груз остался"
          }

          # Библиотеки времени выполнения MSVC кладём рядом с exe: на
          # служебных ПК без прав администратора нет ни установщика
          # Visual C++, ни возможности его поставить.
          # Папку ищем по самому файлу: структура каталогов Redist меняется
          # от версии к версии, и угадывать её именем — ненадёжно.
          $anchor = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" `
                      -Recurse -Filter msvcp140.dll -ErrorAction SilentlyContinue |
                    Where-Object { $_.FullName -match '\\x64\\' -and $_.FullName -match 'Redist' } |
                    Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $anchor) { throw "Не найдены библиотеки MSVC для распространения" }
          $crt = $anchor.DirectoryName
          Write-Host "Библиотеки MSVC: $crt"
          foreach ($dll in @('msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll')) {
            $src = Join-Path $crt $dll
            if (-not (Test-Path $src)) { throw "Нет $dll в $crt" }
            Copy-Item $src dist/
          }

          # Проверка: приложение не должно зависеть от того, что стоит
          # на машине следователя.
          # ffmpeg_kit_flutter_new_plugin.dll в списке не по ошибке: его
          # импортирует сам exe, и без него приложение молча не запускается.
          # То же с плеером предпросмотра: exe импортирует плагины media_kit,
          # а media_kit_video_plugin.dll — libmpv-2.dll (плеер со своим ffmpeg
          # внутри), libEGL.dll и libGLESv2.dll (ANGLE). Нет любой из них —
          # приложение не стартует вовсе. d3dcompiler_47.dll ANGLE грузит сам
          # при запуске. Заодно список ловит пересечение имён: если удаление
          # ffmpeg-kit выше однажды заденет DLL плеера, сборка упадёт здесь.
          foreach ($needed in @('subtitler.exe','flutter_windows.dll','msvcp140.dll',
                                'vcruntime140.dll','vcruntime140_1.dll',
                                'ffmpeg_kit_flutter_new_plugin.dll',
                                'media_kit_video_plugin.dll',
                                'media_kit_libs_windows_video_plugin.dll',
                                'libmpv-2.dll','libEGL.dll','libGLESv2.dll',
                                'd3dcompiler_47.dll',
                                'tools/ffmpeg/ffmpeg.exe','fonts/NotoSans-Regular.ttf')) {
            if (-not (Test-Path (Join-Path dist $needed))) { throw "В сборке нет $needed" }
          }

          # Груз ffmpeg-kit ловим прямо по именам, а не только по размеру:
          # с плеером папка и так выросла, и возврат пары DLL порог размера
          # может не заметить. У libmpv ffmpeg вшит внутрь, отдельных
          # avcodec-*.dll у него нет — любая такая DLL в папке от ffmpeg-kit.
          $kitLeft = Get-ChildItem dist -Recurse -File |
                     Where-Object { $_.Name -match '^(libffmpegkit.*|av(codec|format|filter|util|device)-\d+|sw(scale|resample)-\d+)\.dll$' }
          if ($kitLeft) {
            throw "В сборку вернулся ffmpeg-kit: $(($kitLeft.Name) -join ', ')"
          }

          $mb = [math]::Round((Get-ChildItem dist -Recurse | Measure-Object Length -Sum).Sum / 1MB, 1)
          Write-Host "Размер распакованной папки: $mb МБ"
          # Размер — тоже проверка. Если лишняя сборка ffmpeg вернётся в архив,
          # папка вырастет на 117 МБ, и узнать об этом надо здесь, а не из
          # жалоб на скачивание по служебной сети.
          # Из чего складываются 200 МБ: ffmpeg.exe ~98, плеер media_kit (libmpv,
          # ANGLE) ~46, Flutter, плагины и библиотеки MSVC ~34 — по замеру
          # 2026-09-25 папка весит 178,5 МБ, остальное запас на рост
          # зависимостей. Возврат ffmpeg-kit (+117 МБ) порог пробьёт.
          if ($mb -gt 200) {
            throw "Папка выросла до $mb МБ — похоже, в неё вернулась лишняя сборка ffmpeg"
          }
          Compress-Archive -Path dist/* -DestinationPath subtitler-windows-x64.zip

      # Каждая DLL, которую импортируют exe и DLL из папки, должна лежать
      # рядом с ними или входить в саму Windows, иначе на ПК следователя
      # программа не запустится. Список обязательных файлов выше этого не
      # ловит: он знает только названные файлы. Запуск exe здесь тоже не
      # поймал бы: на раннере стоят Visual C++ и отладочный CRT, которых у
      # следователя нет. Импорты читает dumpbin из Visual Studio раннера.
      - name: Проверить импорты DLL
        shell: pwsh
        run: |
          # Журналы Actions без входа в GitHub не видны, а аннотации видны
          # всем: причину провала шаг пишет аннотацией, чтобы её можно было
          # прочитать и без учётной записи.
          try {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            $vs = & $vswhere -latest -products * `
                    -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
                    -property installationPath
            if (-not $vs) { throw "Не найдена Visual Studio с инструментами C++" }
            $dumpbin = Get-ChildItem (Join-Path $vs 'VC\Tools\MSVC') -Recurse -Filter dumpbin.exe |
                       Where-Object { $_.FullName -match '\\Hostx64\\x64\\' } |
                       Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $dumpbin) { throw "Не найден dumpbin.exe" }
            Write-Host "::notice title=Проверить импорты DLL::dumpbin: $($dumpbin.FullName)"

            # DLL, которые на Windows не загружаются, — их импорты не проверяем,
            # пока их не импортирует кто-то из папки (тогда проверка упадёт):
            # - zlib.dll приезжает с ANGLE плеера. Ни одна DLL папки её не
            #   импортирует и не называет по имени. Собрана с отладочным CRT
            #   (ucrtbased.dll, VCRUNTIME140D.dll).
            # - dartjni.dll собирает пакет jni (его тянет path_provider_android),
            #   и только там, где стоит Java: на раннере она есть, на машине
            #   разработчика — не всегда. Импортирует jvm.dll, которой у
            #   следователя нет. Вызывается лишь из кода для Android; на Windows
            #   пути даёт path_provider_windows. С ней вышли 0.1.0 и 0.1.1 и на
            #   ПК без Java запускались.
            $unused = @('zlib.dll', 'dartjni.dll')

            $pes = Get-ChildItem dist -Recurse -File | Where-Object { $_.Extension -in '.exe', '.dll' }
            $deps = @{}
            $importers = @{}
            foreach ($pe in $pes) {
              $out = & $dumpbin.FullName /nologo /dependents $pe.FullName
              if ($LASTEXITCODE -ne 0) { throw "dumpbin не прочитал $($pe.FullName)" }
              $deps[$pe.FullName] = @($out | ForEach-Object { $_.Trim() } |
                                      Where-Object { $_ -match '^[\w.\-]+\.dll$' })
              foreach ($dep in $deps[$pe.FullName]) { $importers[$dep.ToLower()] = $pe.Name }
            }

            $missing = New-Object System.Collections.Generic.List[string]
            foreach ($pe in $pes) {
              if ($unused -contains $pe.Name.ToLower() -and -not $importers.ContainsKey($pe.Name.ToLower())) {
                Write-Host "Пропущена $($pe.Name): её никто не загружает"
                continue
              }
              foreach ($dep in $deps[$pe.FullName]) {
                # Рядом с тем, кто её импортирует: там её найдёт загрузчик Windows.
                if (Test-Path (Join-Path $pe.DirectoryName $dep)) { continue }
                # В System32 раннера есть то, чего у следователя нет: библиотеки
                # Visual C++ (msvcp140_1, concrt140…) и отладочный CRT, а в N- и
                # LTSC-редакциях нет Media Foundation. Такие DLL должны лежать в папке.
                $name = $dep.ToLower()
                $notInWindows = $name -match '^(msvcp1|vcruntime1|concrt1|vcomp1|mfc1|ucrtbased|mfplat|mfreadwrite|mfplay|mf|evr)[\w.\-]*\.dll$'
                $inWindows = $name -match '^(api-ms-win-|ext-ms-)' -or
                             (Test-Path (Join-Path "$env:WINDIR\System32" $dep))
                if ($notInWindows -or -not $inWindows) {
                  $missing.Add("$dep (её импортирует $($pe.Name))")
                }
              }
            }
            Write-Host "Проверено файлов: $($pes.Count)"
            if ($missing.Count) {
              throw "Не хватает DLL — на ПК следователя программа не запустится: $(($missing | Sort-Object -Unique) -join '; ')"
            }
            Write-Host "Все импортируемые DLL лежат в папке или входят в Windows"
          } catch {
            Write-Host "::error title=Проверить импорты DLL::$($_.Exception.Message)"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: subtitler-windows-x64
          path: subtitler-windows-x64.zip
          # На бесплатном тарифе всего 500 МБ под артефакты на весь аккаунт,
          # а по умолчанию они лежат 90 дней. Сборки крупные.
          retention-days: 14

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      # На раннере ffmpeg не установлен, а часть тестов его запускает.
      - name: Поставить ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          if ! ffmpeg -hide_banner -filters | grep -qw subtitles; then
            echo "В ffmpeg этой системы нет фильтра subtitles — тесты вшивания будут пропущены"
          fi

      - name: Зависимости
        run: flutter pub get

      - name: Анализ и тесты
        run: |
          flutter analyze
          flutter test

      # Подписывается отладочным ключом: раздаём APK напрямую, магазинов нет.
      # Перед раздачей следователям сюда надо подставить свой keystore.
      - name: Сборка APK
        run: flutter build apk --release

      # Разрешение на интернет Flutter кладёт только в отладочный манифест.
      # Без него релизный APK не может выйти в сеть — а это всё приложение.
      - name: Проверить разрешение на интернет
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          if ! "$AAPT" dump permissions build/app/outputs/flutter-apk/app-release.apk \
               | grep -q 'android.permission.INTERNET'; then
            echo "В релизном APK нет разрешения INTERNET — приложение будет без сети"
            exit 1
          fi
          echo "Разрешение INTERNET на месте"

      - name: Проверить, что архитектура одна
        run: |
          ABIS=$(unzip -l build/app/outputs/flutter-apk/app-release.apk \
                 | awk '{print $4}' | grep '^lib/' | cut -d/ -f2 | sort -u)
          echo "Архитектуры в APK: $ABIS"
          if [ "$ABIS" != "arm64-v8a" ]; then
            echo "Ожидалась только arm64-v8a: лишние архитектуры утраивают размер"
            exit 1
          fi

      # На Android предпросмотр — video_player (ExoPlayer), нативных библиотек
      # плеера в APK быть не должно. libmpv.so появляется, если кто-то добавит
      # media_kit_libs_video или media_kit_libs_android_video: с ними в APK
      # едет вторая копия ffmpeg рядом с нашей, было 271 МБ вместо 60.
      - name: Проверить, что в APK нет libmpv
        run: |
          if unzip -l build/app/outputs/flutter-apk/app-release.apk | grep -q 'libmpv\.so'; then
            echo "В APK попал libmpv.so — подключены библиотеки media_kit для Android"
            exit 1
          fi
          echo "libmpv.so в APK нет"

      - uses: actions/upload-artifact@v4
        with:
          name: subtitler-android
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  # Постоянная ссылка, которую можно отправить следователю. Артефакты сборки
  # для этого не годятся: GitHub отдаёт их только вошедшим в аккаунт, и живут
  # они две недели. Релиз по тегу v* скачивается без аккаунта и не исчезает.
  #
  # Отдельная задача, и право записи есть только у неё: шаги сборки выполняют
  # сторонний код плагинов, и давать им запись в репозиторий незачем.
  #
  # В релиз идёт только Windows-архив. APK пока подписан отладочным ключом —
  # раздавать его рано, это записано и в README.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: subtitler-windows-x64
          path: release

      - name: Опубликовать релиз
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f release/subtitler-windows-x64.zip ]; then
            echo "Нет архива для релиза"
            exit 1
          fi

          # Текст для человека, который откроет страницу релиза. Каждый шаг
          # здесь — место, где без подсказки застревают.
          cat > notes.md <<'EOF'
          ## Как запустить на Windows 10/11

          1. Скачайте **subtitler-windows-x64.zip** (ниже, в разделе Assets).
          2. Распакуйте архив **целиком** в любую папку, например на рабочий стол.
             Запускать программу прямо из архива нельзя: ей нужны файлы,
             которые лежат рядом с ней.
          3. Откройте папку и запустите **subtitler.exe**. Устанавливать ничего
             не нужно, права администратора не нужны.
          4. Если появится окно «Система Windows защитила ваш компьютер» —
             нажмите «Подробнее», затем «Выполнить в любом случае». Программа не
             подписана сертификатом, поэтому Windows предупреждает о ней при
             первом запуске.
          5. Введите свой API-ключ Яндекс Облака. Он хранится только на этом
             компьютере.
          EOF

          # --verify-tag: публикуем только к уже отправленному тегу и никогда
          # не создаём новый.
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Subtitler $GITHUB_REF_NAME" \
            --notes-file notes.md \
            release/subtitler-windows-x64.zip
