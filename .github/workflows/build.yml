name: Сборка

# Собирать Windows-версию можно только на Windows: flutter build windows
# требует MSVC. На машине разработчика (macOS) её не собрать, поэтому
# сборка и упаковка живут здесь.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

env:
  FLUTTER_VERSION: '3.44.6'
  # Сборка с libass: без неё фильтра subtitles не существует и вшивание
  # субтитров невозможно.
  # Статическая сборка: один самодостаточный ffmpeg.exe без DLL рядом.
  # ffprobe не везём — длительность приложение читает у самого ffmpeg,
  # а второй такой же статический бинарник стоил бы лишних 98 МБ.
  FFMPEG_URL: 'https://github.com/GyanD/codexffmpeg/releases/download/9.0.1/ffmpeg-9.0.1-essentials_build.zip'

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Зависимости
        run: flutter pub get

      # ffmpeg нужен ДО тестов: часть тестов реально запускает его, а на
      # раннерах GitHub его нет вообще. Заодно тесты вшивания субтитров
      # выполняются здесь по-настоящему — на macOS они пропускаются,
      # потому что там ffmpeg обычно без libass.
      - name: Скачать ffmpeg с libass
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:FFMPEG_URL -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_unpacked
          $bin = Get-ChildItem -Path ffmpeg_unpacked -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $bin) { throw "ffmpeg.exe не найден в архиве" }
          $filters = & $bin.FullName -hide_banner -filters
          if (-not ($filters -match '\bsubtitles\b')) {
            throw "В скачанной сборке ffmpeg нет фильтра subtitles (нет libass)"
          }
          New-Item -ItemType Directory -Force -Path dist/tools/ffmpeg | Out-Null
          Copy-Item $bin.FullName dist/tools/ffmpeg/
          $license = Get-ChildItem -Path ffmpeg_unpacked -Recurse -Filter LICENSE* | Select-Object -First 1
          if ($license) { Copy-Item $license.FullName dist/tools/ffmpeg/ }
          # Тесты и приложение читают эти переменные.
          "SUBTITLER_FFMPEG=$(Resolve-Path dist/tools/ffmpeg/ffmpeg.exe)" >> $env:GITHUB_ENV
          # ffprobe в сборку не кладём: приложение обходится без него.
          # Для тестов на этом раннере он тоже не нужен — длительность
          # читается из вывода ffmpeg.

      - name: Анализ и тесты
        run: |
          flutter analyze
          flutter test

      - name: Сборка
        run: flutter build windows --release

      - name: Собрать переносимую папку
        shell: pwsh
        run: |
          Copy-Item -Recurse build/windows/x64/runner/Release/* dist/
          Copy-Item -Recurse assets/fonts dist/fonts

          # Библиотеки времени выполнения MSVC кладём рядом с exe: на
          # служебных ПК без прав администратора нет ни установщика
          # Visual C++, ни возможности его поставить.
          # Папку ищем по самому файлу: структура каталогов Redist меняется
          # от версии к версии, и угадывать её именем — ненадёжно.
          $anchor = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" `
                      -Recurse -Filter msvcp140.dll -ErrorAction SilentlyContinue |
                    Where-Object { $_.FullName -match '\\x64\\' -and $_.FullName -match 'Redist' } |
                    Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $anchor) { throw "Не найдены библиотеки MSVC для распространения" }
          $crt = $anchor.DirectoryName
          Write-Host "Библиотеки MSVC: $crt"
          foreach ($dll in @('msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll')) {
            $src = Join-Path $crt $dll
            if (-not (Test-Path $src)) { throw "Нет $dll в $crt" }
            Copy-Item $src dist/
          }

          # Проверка: приложение не должно зависеть от того, что стоит
          # на машине следователя.
          foreach ($needed in @('subtitler.exe','flutter_windows.dll','msvcp140.dll',
                                'vcruntime140.dll','vcruntime140_1.dll',
                                'tools/ffmpeg/ffmpeg.exe','fonts/NotoSans-Regular.ttf')) {
            if (-not (Test-Path (Join-Path dist $needed))) { throw "В сборке нет $needed" }
          }

          $mb = [math]::Round((Get-ChildItem dist -Recurse | Measure-Object Length -Sum).Sum / 1MB, 1)
          Write-Host "Размер распакованной папки: $mb МБ"
          Compress-Archive -Path dist/* -DestinationPath subtitler-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: subtitler-windows-x64
          path: subtitler-windows-x64.zip
          # На бесплатном тарифе всего 500 МБ под артефакты на весь аккаунт,
          # а по умолчанию они лежат 90 дней. Сборки крупные.
          retention-days: 14

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      # На раннере ffmpeg не установлен, а часть тестов его запускает.
      - name: Поставить ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          if ! ffmpeg -hide_banner -filters | grep -qw subtitles; then
            echo "В ffmpeg этой системы нет фильтра subtitles — тесты вшивания будут пропущены"
          fi

      - name: Зависимости
        run: flutter pub get

      - name: Анализ и тесты
        run: |
          flutter analyze
          flutter test

      # Подписывается отладочным ключом: раздаём APK напрямую, магазинов нет.
      # Перед раздачей следователям сюда надо подставить свой keystore.
      - name: Сборка APK
        run: flutter build apk --release

      - name: Проверить, что архитектура одна
        run: |
          ABIS=$(unzip -l build/app/outputs/flutter-apk/app-release.apk \
                 | awk '{print $4}' | grep '^lib/' | cut -d/ -f2 | sort -u)
          echo "Архитектуры в APK: $ABIS"
          if [ "$ABIS" != "arm64-v8a" ]; then
            echo "Ожидалась только arm64-v8a: лишние архитектуры утраивают размер"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: subtitler-android
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
