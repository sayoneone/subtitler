name: subtitler
description: Русские субтитры для видео с турецкой и узбекской речью
publish_to: none
version: 0.2.0

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # сеть и файлы
  dio: ^5.11.1
  path: ^1.9.0
  path_provider: ^2.1.6

  # ключ пользователя
  flutter_secure_storage: ^11.1.0

  # ffmpeg на Android (на десктопе используем внешний ffmpeg.exe)
  ffmpeg_kit_flutter_new: ^4.6.2

  # Плеер предпросмотра: на каждой платформе свой, общий интерфейс —
  # lib/ui/player/preview_player.dart.
  # Windows: media_kit. libmpv со своим ffmpeg и ANGLE лежат рядом с exe и не
  # зависят ни от Media Foundation, ни от кодеков ОС — поэтому работает и на
  # N/LTSC-редакциях служебных ПК, где этих кодеков нет.
  # Android и macOS: официальный video_player (ExoPlayer / AVFoundation) —
  # ни одной .so в APK не добавляет.
  # Нативные библиотеки media_kit подключаем ТОЛЬКО для Windows. Общий
  # media_kit_libs_video и media_kit_libs_android_video НЕЛЬЗЯ: они кладут в
  # APK вторую копию ffmpeg рядом с нашей — было 271 МБ вместо 60. CI падает,
  # если в APK появится libmpv.so.
  # Версии прибиты точно: media_kit в режиме limited maintenance, и новая
  # сборка libmpv — это другой ffmpeg внутри и другой размер архива.
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_windows_video: 1.0.11
  video_player: 2.14.0

  # приём и выдача файлов (план 2)
  receive_sharing_intent: ^1.9.0
  share_plus: ^13.3.0
  gal: ^2.3.3
  desktop_drop: ^0.8.4
  file_selector: ^1.1.0
  window_manager: ^0.5.2
  package_info_plus: ^10.2.1
  wakelock_plus: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Проверка настоящего плеера (integration_test/): libmpv и текстура ANGLE
  # работают только в собранном приложении, не в `flutter test`.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Подмена путей path_provider в тесте AppRuntime: рабочая папка должна
  # лечь в LocalAppData, а не в перемещаемый профиль.
  path_provider_platform_interface: ^2.1.2

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  # Тот же файл, что libass получает при вшивании: субтитры в предпросмотре
  # рисуются им же, иначе переносы строк и ширина реплики разойдутся с
  # готовым видео. Одного `assets:` мало — шрифтом Flutter видит только
  # объявленное семейство.
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
