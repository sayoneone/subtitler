name: subtitler
description: Русские субтитры для видео с турецкой и узбекской речью
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # сеть и файлы
  dio: ^5.11.1
  path: ^1.9.0
  path_provider: ^2.1.6

  # ключ пользователя
  flutter_secure_storage: ^11.1.0

  # ffmpeg на Android (на десктопе используем внешний ffmpeg.exe)
  ffmpeg_kit_flutter_new: ^4.6.2

  # Плеер предпросмотра (media_kit) появится вместе с редактором из плана 2.
  # Пока его нет в зависимостях намеренно: он тянет собственную сборку ffmpeg,
  # и в APK оказывались ДВЕ копии ffmpeg — наша и его. Это 271 МБ вместо 60.

  # приём и выдача файлов (план 2)
  receive_sharing_intent: ^1.9.0
  share_plus: ^13.3.0
  gal: ^2.3.3
  desktop_drop: ^0.8.4
  file_selector: ^1.1.0
  window_manager: ^0.5.2
  package_info_plus: ^10.2.1
  wakelock_plus: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
